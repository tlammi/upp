name: CI
on:
  push:
    branches: [maister]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install --user --break-system-packages meson
          sudo apt-get install -y ninja-build g++-16
      - name: Build
        run: make
      - name: Test
        run: make test
